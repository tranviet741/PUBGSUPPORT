<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — PUBG Tool</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>PUBG PC Tool</h1>
      <p class="subtitle">Đăng nhập để sử dụng công cụ tính cối &amp; hầm bí mật</p>

      <div class="auth-tabs">
        <button type="button" class="active" id="tabLogin">Đăng nhập</button>
        <button type="button" id="tabRegister">Đăng ký</button>
      </div>

      <div class="auth-message" id="authMessage"></div>

      <form class="auth-form" id="loginForm">
        <div class="field">
          <label for="loginUser">Tên đăng nhập</label>
          <input type="text" id="loginUser" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="loginPass">Mật khẩu</label>
          <input type="password" id="loginPass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary">Đăng nhập</button>
      </form>

      <form class="auth-form" id="registerForm" style="display:none">
        <div class="field">
          <label for="regUser">Tên đăng nhập</label>
          <input type="text" id="regUser" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="regPass">Mật khẩu</label>
          <input type="password" id="regPass" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="regPass2">Nhập lại mật khẩu</label>
          <input type="password" id="regPass2" autocomplete="new-password" required />
        </div>
        <button type="submit" class="primary">Tạo tài khoản</button>
      </form>

      <p class="auth-hint">
        Tài khoản mặc định: <strong>admin</strong> / <strong>admin123</strong><br />
        (Chỉ dùng demo — đổi mật khẩu sau khi đăng ký tài khoản mới)
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
