<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — PUBG Tool</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>PUBG PC Tool</h1>
      <p class="subtitle">Đăng nhập để sử dụng công cụ tính cối &amp; hầm bí mật</p>

      <div class="auth-message" id="authMessage"></div>

      <form class="auth-form" id="loginForm">
        <div class="field">
          <label for="loginUser">Tên đăng nhập</label>
          <input type="text" id="loginUser" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="loginPass">Mật khẩu</label>
          <input type="password" id="loginPass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary">Đăng nhập</button>
      </form>

      <p class="auth-hint">
        Liên hệ <strong>admin</strong> để được cấp tài khoản.
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
